spring:
  application:
    name: pasteleria-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pasteleria}
    username: ${DB_USER:pasteleria}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  issuer: pasteleria-api
  audience: pasteleria-web
  access-minutes: ${ACCESS_MINUTES:10}
  refresh-days: 7
  cookie-secure: ${COOKIE_SECURE:false}
  key-directory: ${JWT_KEY_DIRECTORY:.keys}
  seed-demo: ${SEED_DEMO:false}
  admin-password: ${ADMIN_PASSWORD:}
  bootstrap-admin: ${BOOTSTRAP_ADMIN:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
